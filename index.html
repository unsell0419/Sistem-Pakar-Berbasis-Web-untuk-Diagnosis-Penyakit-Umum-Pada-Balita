<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Pakar Diagnosa Penyakit Umum Pada Balita</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    
    <div class="container">
      <h1>Diagnosis Penyakit Umum Pada Balita</h1>
      <h3>Pilih Gejala yang dialami balita</h3>
      <form id="symptom-form">
        <div class="symptoms-grid">
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="muntah" />
            Muntah</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="tenggorok" />
            Sakit Tenggorokan</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="lesu" /> Lesu</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="demam" />
            Demam</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="telan" />
            Kesulitan Menelan</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="meradang" />
            Meradang</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="nyeri telinga" />
            Nyeri Telinga</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="pilek" />
            Pilek</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="kelelahan" />
            Kelelahan</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="sesak" /> Sesak Nafas</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="serak" /> Suara serak</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="nafas" /> Nafas pendek dan cepat</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="benjolan" /> Benjolan kecil</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="nyeri" /> Nyeri perut</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="darah" /> Darah pada tinja</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="mengejan" /> Mengejan keras saat BAB</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="nyeri bab" /> Nyeri saat BAB</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="bintil" /> Bintil-bintil kecil</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="bengkak" /> Bengkak</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="gerak" /> Gerakan tubuh yang tidak biasa</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="cairan" /> Keluar cairan dari telinga</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="pendengaran" /> Gangguan pendengaran</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="kurus" /> Tubuh kurus</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="otot" /> Otot mengecil</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="sakit" /> Mudah sakit</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="perut kembung" />
            Perut Kembung</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="kering" />
            Kulit kering</label
          >
          <label class="gejala"
            ><input
              type="checkbox"
              name="symptoms"
              value="nafsu makan berkurang"
            />
            Nafsu Makan Berkurang</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="susah bab" /> Susah
            BAB</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="kering" /> Kulit kering</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="bersin" /> Bersin-bersin</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="ruam merah" /> Ruam
            Merah</label
          >
          <label class="gejala"
            ><input
              type="checkbox"
              name="symptoms"
              value="kosong"
            />
            Tatapan kosong</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="gatal" />
            Gatal</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="hidung tersumbat" />
            Hidung Tersumbat</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="batuk" />
            Batuk</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="diare" />
            Diare</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="tidak bertambah" />
            Berat Badan Tidak Bertambah</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="kejang" />
            Kejang-kejang</label
          >
          <label class="gejala"
            ><input type="checkbox" name="symptoms" value="lambat" />
            Pertumbuhan Lambat</label
          >
        </div>
        <div class="buttons">
          <button type="submit">Periksa Gejala</button>
          <button type="reset">Reset</button>
        </div>
      </form>
      <div id="hasil-diagnosa">
        <p id="result"></p>

        <p id="suggestion" style="font-style: italic; color: #555;"></p>
      </div>  
      <footer>
        <p>&copy; 2024 Sistem Pakar Diagnosa Penyakit Umum Pada Balita. All rights reserved.</p>
    </footer>
    
    <script src="script.js"></script>
  
  </body>
</html>
